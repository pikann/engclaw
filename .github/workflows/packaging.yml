name: Packaging smoke test
# ENGC-54: build unsigned Linux installer and run the packaged app's native-module smoke test.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/electron-builder.yml'
      - 'apps/desktop/build/**'
      - 'apps/desktop/package.json'
      - 'apps/desktop/src/utility/**'
      - 'scripts/espeak/**'
      - 'scripts/perf/**'
      - '.github/workflows/packaging.yml'

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # Skip onnxruntime-node's install-time CUDA download (hundreds of MB, Linux only).
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  package:
    name: package (linux-x64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx electron-vite build
      - name: Build bundled espeak-ng
        working-directory: .
        run: ./scripts/espeak/build.sh
      - run: bunx electron-builder --linux AppImage deb --x64
      - name: Installer sizes
        shell: bash
        run: |
          find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec ls -l {} +
          bun ../../scripts/perf/installer-size.ts release
      - name: Smoke test
        run: ENGCLAW_SMOKE=1 xvfb-run --auto-servernum "$(find release/linux-unpacked -maxdepth 1 -type f -perm -u+x ! -name "*.so*" ! -name chrome_crashpad_handler ! -name chrome-sandbox | head -1)" --no-sandbox
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-linux-x64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
