name: Packaging smoke test
# ENGC-54: build unsigned installers per OS/arch and run the packaged app's native-module smoke test.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/electron-builder.yml'
      - 'apps/desktop/build/**'
      - 'apps/desktop/package.json'
      - 'apps/desktop/src/utility/**'
      - '.github/workflows/packaging.yml'

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # Skip onnxruntime-node's install-time CUDA download (hundreds of MB, Linux only).
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-latest, builder: '--mac dmg --arm64', expectOrt: true }
          # onnxruntime-node 1.31.x ships no darwin/x64 binary: this leg is expected to fail the ORT check.
          - { name: mac-x64, os: macos-15-intel, builder: '--mac dmg --x64', expectOrt: false }
          - { name: win-x64, os: windows-latest, builder: '--win nsis --x64', expectOrt: true }
          - {
              name: linux-x64,
              os: ubuntu-latest,
              builder: '--linux AppImage deb --x64',
              expectOrt: true,
            }
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.expectOrt }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx electron-vite build
      - run: bunx electron-builder ${{ matrix.builder }}
      - name: Installer sizes
        shell: bash
        run: ls -l release/*.dmg release/*.exe release/*.AppImage release/*.deb 2>/dev/null
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ENGCLAW_SMOKE=1 release/mac*/Engclaw.app/Contents/MacOS/Engclaw
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ENGCLAW_SMOKE=1 release/win-unpacked/Engclaw.exe
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ENGCLAW_SMOKE=1 xvfb-run --auto-servernum "$(find release/linux-unpacked -maxdepth 1 -type f -perm -u+x ! -name "*.so*" ! -name chrome_crashpad_handler ! -name chrome-sandbox | head -1)" --no-sandbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
