name: Release
# Build unsigned installers for macOS, Windows and Linux and attach them to the GitHub release.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # Skip onnxruntime-node's install-time CUDA download (hundreds of MB, Linux only).
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, args: '--mac dmg --arm64' }
          - { name: windows-x64, os: windows-latest, args: '--win nsis --x64' }
          - { name: linux-x64, os: ubuntu-latest, args: '--linux AppImage deb --x64' }
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx electron-vite build
      - name: Package
        env:
          TAG: ${{ github.event.release.tag_name }}
        # The tag (v1.2.3 or 1.2.3) is the source of truth for the app version.
        run: bunx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version="${TAG#v}"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.exe release/*.AppImage release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then echo "No installers produced" >&2; exit 1; fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
