name: Release
# Tag vX.Y.Z -> signed + notarized builds on mac/win/linux -> installers, latest*.yml (electron-updater
# feed) and SHA256SUMS uploaded to the GitHub Release for that tag.
# Create the release yourself first (GitHub UI: new tag + notes, draft or published). This workflow never
# creates one and fails fast if there is none.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Skip onnxruntime-node's install-time CUDA download (hundreds of MB, Linux only).
  ONNXRUNTIME_NODE_INSTALL: skip
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: macos-arm64,
              os: macos-latest,
              args: '--mac dmg zip --arm64 -c.mac.notarize=true',
            }
          - { name: windows-x64, os: windows-latest, args: '--win nsis --x64' }
          - { name: linux-x64, os: ubuntu-latest, args: '--linux AppImage deb --x64' }
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Require a GitHub release for this tag
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Drafts are only visible through the API list, which also covers published releases.
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          [[ -n "$found" ]] || { echo "::error::No GitHub release exists for $TAG. Create it first (GitHub UI: tag + notes), then re-run this workflow."; exit 1; }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx electron-vite build
      - name: Set up MSYS2 (Windows espeak-ng build)
        if: matrix.name == 'windows-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja curl
      - name: Build bundled espeak-ng (macOS, Linux)
        if: matrix.name != 'windows-x64'
        working-directory: .
        run: ./scripts/espeak/build.sh
      - name: Build bundled espeak-ng (Windows)
        if: matrix.name == 'windows-x64'
        shell: msys2 {0}
        working-directory: .
        run: ./scripts/espeak/build.sh
      - name: Write App Store Connect API key (macOS notarization)
        if: matrix.name == 'macos-arm64'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Package, sign and upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Allow uploading into a release that was published a while ago (e.g. on a re-run).
          EP_GH_IGNORE_TIME: 'true'
          # macOS: Developer ID Application cert (base64 .p12) + notarytool API key.
          CSC_LINK: ${{ matrix.name == 'macos-arm64' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos-arm64' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows: code-signing certificate (base64 .pfx). Swap for SignPath / Trusted Signing if chosen.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        # The tag (v1.2.3 or 1.2.3) is the source of truth for the app version.
        run: bunx electron-builder ${{ matrix.args }} --publish always -c.extraMetadata.version="${TAG#v}"
      - name: Verify macOS signature and notarization
        if: matrix.name == 'macos-arm64'
        run: |
          app=$(ls -d release/mac-arm64/*.app)
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' --pattern '*.AppImage' --pattern '*.deb'
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          # Version-less copies so the README download buttons can use
          # https://github.com/<repo>/releases/latest/download/<name> and always get the newest build.
          mkdir stable
          cp -- *.dmg stable/Engclaw-macOS-arm64.dmg
          cp -- *.exe stable/Engclaw-Windows-x64.exe
          cp -- *.AppImage stable/Engclaw-Linux-x64.AppImage
          cp -- *.deb stable/Engclaw-Linux-x64.deb
          gh release upload "$TAG" stable/* --clobber --repo "$GITHUB_REPOSITORY"
