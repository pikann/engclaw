name: Release
# Tag vX.Y.Z -> signed + notarized builds on mac/win/linux -> draft GitHub Release with installers,
# latest*.yml (electron-updater feed), SHA256SUMS and notes from conventional commits. Publish manually.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Skip onnxruntime-node's install-time CUDA download (hundreds of MB, Linux only).
  ONNXRUNTIME_NODE_INSTALL: skip
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Create draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/changelog/notes.ts "$TAG" > notes.md
          flags=(--draft --title "$TAG" --notes-file notes.md --verify-tag)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"

  build:
    name: build (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: macos-arm64,
              os: macos-latest,
              args: '--mac dmg zip --arm64 -c.mac.notarize=true',
            }
          - { name: windows-x64, os: windows-latest, args: '--win nsis --x64' }
          - { name: linux-x64, os: ubuntu-latest, args: '--linux AppImage deb --x64' }
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx electron-vite build
      - name: Write App Store Connect API key (macOS notarization)
        if: matrix.name == 'macos-arm64'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Import macOS signing certificate into a keychain
        # electron-builder 25 creates its keychain with a random password but then passes the .p12 password to
        # `security set-key-partition-list`, which macOS 26 runners reject. Build the keychain ourselves and
        # hand it over via CSC_KEYCHAIN (CSC_LINK must stay unset so electron-builder uses it as is).
        if: matrix.name == 'macos-arm64'
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(uuidgen)"
          printf '%s' "$CSC_LINK_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Package, sign and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # macOS: signs with the keychain from the import step (CSC_KEYCHAIN) + notarytool API key.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows: code-signing certificate (base64 .pfx). Swap for SignPath / Trusted Signing if chosen.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        # The tag (v1.2.3 or 1.2.3) is the source of truth for the app version.
        run: bunx electron-builder ${{ matrix.args }} --publish always -c.extraMetadata.version="${TAG#v}"
      - name: Verify macOS signature and notarization
        if: matrix.name == 'macos-arm64'
        run: |
          app=$(ls -d release/mac-arm64/*.app)
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' --pattern '*.AppImage' --pattern '*.deb'
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
