name: CI
on:
  push: { branches: [master] }
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: License check
        if: runner.os == 'Linux'
        run: bun run license:check
      - run: bun run typecheck
      - run: bun run test
      - name: Build (with the dev-only design-system route for e2e)
        run: bun run build
        env:
          VITE_DESIGN_SYSTEM: '1'
      - name: Package (CI artifact only; releases are built in packaging.yml)
        run: bun run package
        env:
          VITE_DESIGN_SYSTEM: '1'
      - name: E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run test:e2e
      - name: E2E
        if: runner.os != 'Linux'
        run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: apps/desktop/release
